[project]
name = "x402-agent-guard"
version = "0.0.1"
description = "Guardrails for LLM agents that pay over x402: limits, approvals, and exposure evaluation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
mcp = ["mcp>=1.9,<2"]
langgraph = ["langgraph>=0.2"]
otel = ["opentelemetry-sdk>=1.25"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
x402-agent-guard-mcp = "x402_agent_guard.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/x402_agent_guard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
